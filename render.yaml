services:
  - type: web
    name: triangle-ai-dm
    runtime: node
    plan: starter
    # Deploys this branch. Change it here (or in Render's Settings) when this work is merged.
    branch: ai-dm-checkout-calendar
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Small database (chats, follow-ups, customer list) lives on this disk so redeploys don't wipe it.
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Master switch. The bot sends NO DMs unless this is "true". Change it on Render's Environment page.
      - key: BOT_ENABLED
        value: "false"
      # Same Node version the bot is tested on.
      - key: NODE_VERSION
        value: "22"
      - key: STATE_FILE
        value: /var/data/bot-state.json
      - key: ADMIN_KEY
        sync: false
      - key: IG_APP_SECRET
        sync: false
      # Optional: the Facebook app secret (App settings -> Basic). Webhooks signed with either secret are accepted.
      - key: META_APP_SECRET
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Stock + prices: the whole service account key file (JSON). Share the sheet with its client_email as Viewer.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # TRIANGLERESELLS WAREHOUSE STOCK (BOT STOCK + BOT PRICES tabs). Not a secret: the sheet stays private.
      - key: WAREHOUSE_SHEET_ID
        value: 1hZQltkbmqhN4acr959K7cNxUcvLW-P38Ut60O805wOw
      - key: HANDOFF_WEBHOOK_URL
        sync: false
      # No Stripe links right now: buyers pay cash, Cash App or Apple Pay through Josh.
      - key: STRIPE_ENABLED
        value: "false"
      # Pickup spot, sent only after payment. Street only, no unit number: every pickup is in the parking lot.
      - key: WAREHOUSE_ADDRESS
        value: Ample Storage, 1260 Partin Rd, Raleigh, NC 27610
      - key: CALENDAR_WEBHOOK_URL
        sync: false
      - key: ACCOUNT_NAME
        value: Triangle Resells
      - key: VENDOR_SITE_URL
        value: triangleresells.com
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: IG_API_VERSION
        value: v23.0
      # How long the bot stays quiet in a chat after a handoff or after the team types in it.
      - key: HUMAN_PAUSE_MINUTES
        value: "720"
      # A buyer who got a price and went quiet gets ONE nudge (with the free Baccarat) after this many minutes. 0 = off.
      - key: QUIET_NUDGE_MINUTES
        value: "90"
