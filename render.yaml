services:
  - type: web
    name: triangle-ai-dm
    runtime: node
    plan: starter
    # Deploys this branch. Change it here (or in Render's Settings) when this work is merged.
    branch: ai-dm-checkout-calendar
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Small database (chats, follow-ups, customer list) lives on this disk so redeploys don't wipe it.
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Master switch. The bot sends NO DMs unless this is "true". Change it on Render's Environment page.
      - key: BOT_ENABLED
        value: "false"
      # Same Node version the bot is tested on.
      - key: NODE_VERSION
        value: "22"
      - key: STATE_FILE
        value: /var/data/bot-state.json
      - key: ADMIN_KEY
        sync: false
      - key: IG_APP_SECRET
        sync: false
      # Optional: the Facebook app secret (App settings -> Basic). Webhooks signed with either secret are accepted.
      - key: META_APP_SECRET
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Stock + prices + sales log: the whole service account key file (JSON). Share BOTH the warehouse sheet and the
      # sales tracker with its client_email as EDITOR (the bot takes sold items off BOT STOCK and logs paid sales).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # TRIANGLERESELLS WAREHOUSE STOCK (BOT STOCK + BOT PRICES tabs). Not a secret: the sheet stays private.
      - key: WAREHOUSE_SHEET_ID
        value: 1hZQltkbmqhN4acr959K7cNxUcvLW-P38Ut60O805wOw
      # Triangle_Resells_Sales_Tracker (one tab per month). Paid bot orders are written here.
      - key: TRACKER_SHEET_ID
        value: 1ks_DjoGUucVHgzf7mhx9P1B1HTySaNxWbGGsteQ1eGI
      # What the bot sends Zelle / Cash App buyers after an order is locked in. Blank = Josh sends it himself.
      - key: PAY_ZELLE
        sync: false
      - key: PAY_CASHAPP
        value: $triangleresells
      - key: HANDOFF_WEBHOOK_URL
        sync: false
      # Card + Apple Pay links. Off until Stripe ID verification is done; cash, Cash App and Zelle work either way.
      - key: STRIPE_ENABLED
        value: "false"
      # Pickup spot, sent only after payment. Street only, no unit number: every pickup is in the parking lot.
      - key: WAREHOUSE_ADDRESS
        value: Ample Storage, 1260 Partin Rd, Raleigh, NC 27610
      - key: CALENDAR_WEBHOOK_URL
        sync: false
      - key: ACCOUNT_NAME
        value: Triangle Resells
      - key: VENDOR_SITE_URL
        value: triangleresells.com
      # Sonnet: in the retest it made far fewer critical mistakes than Haiku (23/25 vs 15/25 chats clean). ~5-6 cents a chat.
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: IG_API_VERSION
        value: v23.0
      # How long the bot stays quiet in a chat after a handoff or after the team types in it.
      - key: HUMAN_PAUSE_MINUTES
        value: "720"
      # While Josh has a chat, a buyer message with no reply from him for this many minutes brings the bot back. 0 = never.
      - key: TAKEOVER_MINUTES
        value: "5"
      # Wait ~42-58s before answering a cold DM (8-18s mid-conversation) so it doesn't answer like a bot.
      - key: HUMAN_REPLY_DELAY
        value: "true"
      # A buyer who got a price and went quiet gets ONE nudge after this many minutes. 0 = off.
      - key: QUIET_NUDGE_MINUTES
        value: "90"
