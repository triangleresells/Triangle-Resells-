services:
  - type: web
    name: triangle-ai-dm
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Small database (chats, follow-ups, customer list) lives on this disk so redeploys don't wipe it.
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Same Node version the bot is tested on.
      - key: NODE_VERSION
        value: "22"
      - key: STATE_FILE
        value: /var/data/bot-state.json
      - key: ADMIN_KEY
        sync: false
      - key: IG_APP_SECRET
        sync: false
      # Optional: the Facebook app secret (App settings -> Basic). Webhooks signed with either secret are accepted.
      - key: META_APP_SECRET
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INVENTORY_SHEET_CSV_URL
        sync: false
      - key: HANDOFF_WEBHOOK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Pickup spot, sent only after payment. Street only, no unit number: every pickup is in the parking lot.
      - key: WAREHOUSE_ADDRESS
        value: Ample Storage, 1260 Partin Rd, Raleigh, NC 27610
      - key: CALENDAR_WEBHOOK_URL
        sync: false
      - key: ACCOUNT_NAME
        value: Triangle Resells
      - key: VENDOR_SITE_URL
        value: triangleresells.com
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: IG_API_VERSION
        value: v23.0
      # How long the bot stays quiet in a chat after a handoff or after the team types in it.
      - key: HUMAN_PAUSE_MINUTES
        value: "720"
      - key: HUMAN_PAUSE_HOURS
        value: "12"
